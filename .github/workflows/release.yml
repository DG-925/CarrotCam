# Builds every CarrotCam app and publishes one GitHub Release.
# Trigger: push a tag like `v1.2.0` (git tag v1.2.0 && git push origin v1.2.0).
# Assets: Windows installer (.exe), portable Windows .zip, Android .apk and
# latest.yml (read by installed desktop apps to auto-update).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to (re)build, e.g. v1.0.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release (if missing)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # tag the commit being built (matters for manual runs on a branch)
            gh release create "$TAG" --target "$GITHUB_SHA" --title "CarrotCam ${TAG#v}" --generate-notes
          fi

  windows:
    needs: create-release
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build virtual camera driver (x64 + x86)
        run: ./native/vcam/build.ps1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Set version from tag
        working-directory: desktop
        run: npm version ($env:TAG -replace '^v','') --no-git-tag-version --allow-same-version

      - name: Typecheck & build
        working-directory: desktop
        run: |
          npx tsc --noEmit -p tsconfig.json
          npx electron-vite build
          npx electron-builder --win --x64 --publish never

      - name: Upload to release
        working-directory: desktop/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # installer + portable zip; latest.yml is what installed apps read to auto-update
          $files = @(Get-ChildItem -File | Where-Object { $_.Name -match '\.(exe|zip)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.Name })
          gh release upload $env:TAG @files --clobber

  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CARROTCAM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret missing - APK will be debug-signed and in-app updates will not install over it"
          fi

      - name: Build APK
        working-directory: mobile
        env:
          CARROTCAM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CARROTCAM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CARROTCAM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter build apk --release --build-name "${TAG#v}" --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk "CarrotCam-${TAG#v}.apk"

      - name: Upload to release
        working-directory: mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "CarrotCam-${TAG#v}.apk" --clobber
